<!DOCTYPE html>
<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "brand-black": "#010502",
                        "brand-green": "#a0e261",
                        "primary": "#a0e261",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        @keyframes rotate-status {
            0%, 20% { transform: translateY(0); opacity: 0; }
            25%, 45% { transform: translateY(-20px); opacity: 1; }
            50%, 70% { transform: translateY(-40px); opacity: 1; }
            75%, 95% { transform: translateY(-60px); opacity: 1; }
            100% { transform: translateY(-80px); opacity: 0; }
        }
        .glass-container {
            background: rgba(160, 226, 97, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(160, 226, 97, 0.2);
            box-shadow: 0 0 40px rgba(160, 226, 97, 0.15), inset 0 0 20px rgba(160, 226, 97, 0.05);
        }
        .radial-glow {
            background: radial-gradient(circle at center, rgba(160, 226, 97, 0.12) 0%, rgba(1, 5, 2, 1) 70%);
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        .animate-pulse-glow {
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .status-scroll {
            animation: rotate-status 10s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-brand-black font-display antialiased overflow-hidden">

<div class="absolute bottom-16 w-48 h-[2px] bg-white/5 overflow-hidden rounded-full">

</div>
</div>
</div>

<div class="flex gap-6 justify-between"><p class="text-white text-base font-medium leading-normal">Carregando...</p></div>
