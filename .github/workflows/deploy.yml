name: Deploy Site to HostGator

on:
  push:
    branches:
      - main  # Executa apenas quando subir para a main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: 🛠️ Instalar Dependências
      run: npm install
      
    - name: 🏗️ Compilar Projeto Astro
      run: npm run build

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # A pasta onde estão seus arquivos no GitHub. 
        # Neste caso, a pasta dist gerada pelo Astro
        local-dir: ./dist/ 
        
        # A pasta de destino na HostGator.
        # Geralmente é public_html/ para o domínio principal.
        server-dir: ./
        
        # Arquivos que NÃO devem subir (segurança e limpeza)
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          README.md
          .github/**